<style>
/* Layout: full-bleed 3D stage, glass cards floating over it (brand + tools top-left, detail card left, clock HUD bottom-center). */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --glass:rgba(255,248,244,.74); --line:#4a2a1422;
  --shadow:0 1px 2px #4a2a1410,0 6px 18px #4a2a1418,0 18px 44px #4a2a1414;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-num:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 50% 40%,#fffdf9,#edddcf);color:var(--ink);
  font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
.eyebrow{font:700 10px var(--f-mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
button{font:inherit;color:inherit}
.btn{min-height:44px;min-width:44px;padding:6px 14px;border-radius:9px;border:1px solid var(--line);background:var(--cream);
  cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:600;
  transition:background .15s,color .15s}
.btn:hover{background:var(--yellow)}
.btn:active,.btn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.btn:focus-visible,.pill-btn:focus-visible,.close:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn small{font:700 9px var(--f-mono);letter-spacing:1px;opacity:.6}

/* top-left stack */
.tl{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;z-index:5;max-width:calc(100% - 32px)}
.brand{padding:12px 18px 12px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border:1px solid #fff8;width:max-content;max-width:100%}
.brand h1{margin:2px 0 0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:.5px}
.brand h1 span{color:var(--coral)}
.brand p{margin:3px 0 0;font-size:12px;color:#6b5f57}
.tools{display:flex;gap:8px}
.tools .btn{flex-direction:row;gap:6px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* detail card */
.card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(14px,env(safe-area-inset-top,0px)) + 168px);
  bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 74px);width:340px;max-width:calc(100% - 32px);overflow:auto;z-index:6;
  border-radius:22px;background:rgba(255,248,244,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow);border:1px solid #fff9;padding:20px 20px 18px}
.card h2{margin:4px 0 6px;font-size:24px;line-height:1.2;font-weight:800}
.card .sum{margin:0 0 14px;color:#5c514a}
.card .close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--cream);cursor:pointer;font-size:18px}
.card .close:hover{background:var(--yellow)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #4a2a1414}
.items .n{font:italic 700 20px/1 var(--f-num);color:var(--coral)}
.items b{display:block;font-size:14px}
.items span{display:block;font-size:12px;color:#6b5f57}
.items .ph{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--cream);border:1px solid var(--line);font:700 10px var(--f-mono);letter-spacing:1px}
.flows{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{padding:5px 12px;border-radius:999px;background:#fff;box-shadow:0 2px 8px #4a2a1414;font-size:12px;border:1px solid var(--line)}
.sec{margin:16px 0 8px}

/* HUD */
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:6px;
  padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border:1px solid #fff8;max-width:calc(100% - 32px)}
.hud .btn{border-radius:999px;padding:4px 14px}
.clock{padding:0 14px 0 12px;display:flex;flex-direction:column;line-height:1.15;min-width:84px}
.clock b{font:italic 700 22px var(--f-num);font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:#6b5f57}
.sep{width:1px;align-self:stretch;background:var(--line);margin:6px 2px}

/* labels */
.pill{font:700 12px var(--f-ui);background:rgba(255,248,244,.94);color:var(--ink);padding:3px 11px 3px 7px;border-radius:999px;
  box-shadow:0 2px 8px #4a2a1414;white-space:nowrap;transition:opacity .2s,background .2s,color .2s;border:1px solid var(--line)}
.pill b{font:700 10px var(--f-mono);letter-spacing:1px;color:var(--coral);margin-right:5px}
.pill.sel{background:var(--ink);color:var(--cream)}
.pill.sel b{color:var(--yellow)}
.pill.dim{opacity:.5}

/* loading + intro */
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 40%,#fffdf9,#edddcf);transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading h2{margin:8px 0 10px;font-size:clamp(40px,9vw,76px);line-height:1.05;font-weight:900;letter-spacing:2px}
#loading p{margin:0;color:#6b5f57}
#loading.err p{color:#a3341c;max-width:34em;margin-inline:auto;padding-inline:16px}
#intro{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#211d1d55;padding:16px}
#intro .box{width:min(420px,100%);padding:22px;border-radius:22px;background:var(--cream);box-shadow:var(--shadow)}
#intro h3{margin:4px 0 12px;font-size:22px}
#intro ol{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
#intro li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
#intro li i{font:italic 700 26px/1 var(--f-num);color:var(--coral)}
#intro .btn{flex-direction:row;width:100%;background:var(--ink);color:var(--cream)}
#intro .btn:hover{background:var(--coral)}


.tg{padding:4px 10px;font-size:11px;gap:0;min-width:48px}
.tg i{font:normal 15px/1.1 var(--f-ui);font-style:normal}
.btn:disabled{opacity:.38;cursor:not-allowed}.btn:disabled:hover{background:var(--cream)}
.card .items li{display:block;padding:0;background:none;border:0;box-shadow:none}
.items button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #4a2a1414;cursor:pointer}
.items button:hover{background:var(--yellow)}.items button:focus-visible{outline:3px solid var(--coral)}
.items .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.items .tags .ph{margin:0}
button.chip{cursor:pointer;font:inherit;font-size:12px}button.chip:hover{background:var(--yellow)}button.chip:focus-visible{outline:3px solid var(--coral)}
.thumb{float:right;width:96px;height:96px;margin:2px 0 8px 10px;border-radius:16px;box-shadow:0 2px 10px #4a2a1422;margin-right:40px}
.card h2{clear:none}.card .arrow{color:var(--coral)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;clear:both;margin:6px 0 0}
.tile{padding:10px 8px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #4a2a1414;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font:italic 700 22px/1.1 var(--f-num);color:var(--coral);overflow-wrap:anywhere}
.tile span{font-size:11px;line-height:1.35;color:#6b5f57}
.tl3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.tl3 li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#8a7d73;position:relative}
.tl3 li::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--stone)}
.tl3 li:first-child::before{display:none}
.tl3 i{width:14px;height:14px;border-radius:50%;background:var(--cream);border:2px solid var(--stone);position:relative;z-index:1}
.tl3 li.on{color:var(--ink);font-weight:700}.tl3 li.on i{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px #db6a4122}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.kv span{color:#6b5f57}.kv b{display:flex;align-items:center;gap:8px}
.ln{display:inline-block;width:30px;height:0;border-top:3px solid var(--coral)}.ln.thematic{border-top-style:dashed}.ln.pending{border-top-style:dotted}
.pin{all:unset;box-sizing:border-box;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 5px;border-radius:999px;background:#fff;border:1.5px solid var(--coral);box-shadow:0 2px 8px #4a2a1422;font:700 11px var(--f-ui);color:var(--ink);white-space:nowrap;transition:opacity .2s}
.pin b{font:700 14px var(--f-ui);color:var(--coral)}.pin:hover{background:var(--yellow)}.pin:focus-visible{outline:3px solid var(--coral)}.pin.num span{display:none}.pin.num{padding:2px 6px}
.side{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 74px);width:318px;max-width:calc(100% - 32px);z-index:6;
  display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:rgba(255,248,244,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);border:1px solid #fff9}
.side-h{display:flex;align-items:center;justify-content:space-between}
.close.sm{position:static;width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--cream);cursor:pointer}
.close.sm:hover{background:var(--yellow)}
#q{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;color:var(--ink)}
#q:focus-visible{outline:3px solid var(--coral)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:#4a2a140f}
.tab{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--cream)}.tab:focus-visible{outline:3px solid var(--coral)}
.side-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.side-list details{border-radius:14px;background:#fff;border:1px solid var(--line)}
.side-list summary{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;font-weight:700;list-style:none}
.side-list summary::-webkit-details-marker{display:none}
.side-list summary b{font:700 10px var(--f-mono);letter-spacing:1px;color:var(--coral)}
.side-list summary em{margin-left:auto;font:normal 11px var(--f-mono);color:#8a7d73}
.row,.isl-go{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 12px;cursor:pointer;font-size:13px;border-top:1px solid var(--line)}
.row:hover,.isl-go:hover{background:var(--yellow)}.row:focus-visible,.isl-go:focus-visible{outline:3px solid var(--coral);outline-offset:-3px}
.row.on{background:var(--ink);color:var(--cream)}.row i{font:normal 15px var(--f-ui);color:var(--coral);width:20px}.row.on i{color:var(--yellow)}
.isl-go{color:#6b5f57;font-size:12px}
.row.flow{border:1px solid var(--line);border-radius:12px;background:#fff}.row.flow small{display:block;color:#8a7d73;font-size:11px}.row.flow.on{background:var(--ink)}
.none{margin:12px;color:#8a7d73}
.grip{display:none;touch-action:none}
.mob-only{display:none}
@media (min-width:801px){.side:not([hidden])~.hud{}}
@media (max-width:800px){
  .grip{display:block;position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--stone);cursor:pointer}
  .grip::after{content:"";position:absolute;inset:-14px -10px}
  .card{padding-top:24px}.card.full,.side.full{height:calc(100% - 70px)}
  .side{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:52%;border-radius:22px 22px 0 0;padding-top:24px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
    padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .thumb{margin-right:44px}
}

.bubble{font:700 11px var(--f-ui);padding:2px 9px;border-radius:999px;background:#fff;border:1.5px solid var(--coral);color:var(--ink);box-shadow:0 2px 8px #4a2a1422;white-space:nowrap;pointer-events:none;transition:opacity .2s}
.btn.tg[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.journal{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));width:318px;max-width:calc(100% - 32px);height:230px;z-index:6;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:22px;background:rgba(255,248,244,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);border:1px solid #fff9}
.jh{display:flex;align-items:center;gap:8px}.jh>div:first-child{flex:1;min-width:0}.jh b{font-size:15px}
.live{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--f-mono);letter-spacing:1.5px;color:#3d7a4a}
.live i{width:8px;height:8px;border-radius:50%;background:#3fae5a;box-shadow:0 0 0 0 #3fae5a88;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px #3fae5a00}100%{box-shadow:0 0 0 0 #3fae5a00}}
#jf{min-height:44px;max-width:112px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;color:var(--ink);padding:0 6px}
#jf:focus-visible{outline:3px solid var(--coral)}
#jl{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
#jl li{display:grid;grid-template-columns:42px 34px 1fr;gap:6px;align-items:baseline;padding:5px 6px;border-radius:9px;font-size:12px;cursor:pointer;background:#fff8}
#jl li:hover{background:var(--yellow)}#jl li:focus-visible{outline:3px solid var(--coral)}
#jl time{font:700 11px var(--f-mono);color:#8a7d73;font-variant-numeric:tabular-nums}
#jl em{font:700 10px var(--f-mono);letter-spacing:1px;font-style:normal;color:var(--coral)}
#jl .k-arrive em{color:#2f6f93}#jl .k-handoff em{color:#3d7a4a}
#jl .empty{display:block;color:#8a7d73;cursor:default}
body.journal-open .side{top:calc(max(14px,env(safe-area-inset-top,0px)) + 242px)}
.legend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 72px);z-index:5;display:flex;gap:16px;padding:8px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);font-size:12px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
@media (max-width:800px){
  .brand h1{font-size:18px}
  .journal{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:42%;border-radius:22px 22px 0 0;padding:24px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .journal.full{height:calc(100% - 70px)}
  body.journal-open .side{top:auto}
  .card{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:34%;border-radius:22px 22px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .tools{flex-direction:column;align-items:flex-start}
  .mob-only{display:inline-flex!important}
  .hud{display:none;flex-wrap:wrap;justify-content:center;border-radius:22px;width:calc(100% - 32px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 8px);z-index:9}
  .hud.open{display:flex}
  .hud .btn{padding:4px 8px}
  .clock{min-width:70px;padding:0 6px}
  .legend{bottom:auto;left:auto;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(14px,env(safe-area-inset-top,0px)) + 8px);transform:none;flex-direction:column;gap:4px;border-radius:16px;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      }
      w.d+=w.dir*w.speed*dt;
      if(w.d>=w.route.len||w.d<=0){w.d=clamp(w.d,0,w.route.len);logEvent(w,'arrive');w.dir=-w.dir;w.wait=1.4;w.stage=1}
    });
  }

  /* ----- journal ----- */
  const jEntries=[], jl=$('jl'), jf=$('jf');
  jf.innerHTML='<option value="all">'+tr('全部串連','All links')+'</option>'+DATA.flows.map(f=>`<option value="${f.id}">${islName(f.from)} → ${islName(f.to)}</option>`).join('');
  const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(Math.floor(m)%60).padStart(2,'0')}`;
  const KIND=LANG==='en'?{depart:'DEPART',arrive:'ARRIVE',handoff:'HAND-OFF'}:{depart:'出發',arrive:'抵達',handoff:'交接'};
  function entryHTML(e){return `<li data-act="flow" data-id="${e.fid}" class="k-${e.kind}" tabindex="0"><time>${e.t}</time><em>${KIND[e.kind]}</em><span>${e.text}</span></li>`}
  function renderJournal(){const list=jEntries.filter(e=>jFilter==='all'||e.fid===jFilter).slice(0,40);jl.innerHTML=list.length?list.map(entryHTML).join(''):'<li class="empty">'+tr('等待小人到站…','Waiting for walkers to arrive…')+'</li>'}
  function logEvent(w,kind){
    if(!w.lead)return;
    const f=w.flow, who=ROLE[w.role]||CITIZEN, toward=w.dir>0?f.to:f.from, here=kind==='arrive'?toward:(w.dir>0?f.from:f.to);
    const text=LANG==='en'?(kind==='depart'?`${who} leaves ${islName(here)} for ${islName(toward)} with “${f.cargo}”`:kind==='arrive'?`${who} arrives at ${islName(here)} with “${f.cargo}”`:`Hand-off of “${f.cargo}” at ${islName(here)}`):(kind==='depart'?`${who}從${islName(here)}出發，往${islName(toward)}送「${f.cargo}」`:kind==='arrive'?`${who}帶著「${f.cargo}」抵達${islName(here)}`:`在${islName(here)}交接「${f.cargo}」`);
    jEntries.unshift({t:hhmm(minutes),kind,text,fid:f.id}); if(jEntries.length>80)jEntries.pop();
    if(journalOn&&(jFilter==='all'||jFilter===f.id))renderJournal();
  }
  function setJournal(on){const jn=$('journal');jn.style.height='';jn.classList.remove('full');if(on&&isMobile()){closeCard();setSide(false)}journalOn=on;$('journal').hidden=!on;$('btnLog').setAttribute('aria-pressed',on);document.body.classList.toggle('journal-open',on);if(on)renderJournal();dirty=true}
  jf.addEventListener('change',()=>{jFilter=jf.value;renderJournal()});
  $('jClose').addEventListener('click',()=>setJournal(false));
  jl.addEventListener('click',onAct);
  jl.addEventListener('keydown',e=>{if(e.key==='Enter')onAct(e)});

  /* ----- walker card ----- */
  function selectWalker(w){
    exitBird(); const f=w.flow,a=islIdx(f.from),b=islIdx(f.to); selIslands=[a,b]; setPills(); setSelItem(null); clearPins(); applyRel(new Set([f.id]));
    const toward=w.dir>0?f.to:f.from;
    openCard(`<div class="eyebrow">${tr('小人','WALKER')} · ${ROLE[w.role]||CITIZEN}</div>
      <h2>${ROLE[w.role]||CITIZEN}</h2><p class="sum">${tr(`正在搬「${f.cargo}」，往${islName(toward)}。`,`Carrying “${f.cargo}” to ${islName(toward)}.`)}</p>
      <div class="kv"><span>${tr('搬運物','Cargo')}</span><b>${f.cargo}</b></div>
      <div class="kv"><span>${tr('路線','Route')}</span><b>${islName(f.from)} ⇄ ${islName(f.to)}</b></div>
      <div class="kv"><span>${tr('課程狀態','Status')}</span><b><i class="ln ${(ev[f.evidence]||ev.pending)[1]}"></i>${(ev[f.evidence]||ev.pending)[0]}</b></div>
      <div class="flows"><button type="button" class="chip" data-act="flow" data-id="${f.id}">${tr('看整條協作線','View the whole flow')}</button><button type="button" class="chip" data-act="island" data-id="${a}">${islName(f.from)}</button><button type="button" class="chip" data-act="island" data-id="${b}">${islName(f.to)}</button></div>`);
    focusOn(w.pos.clone().add(new T.Vector3(0,.2,0)),new T.Vector3(1.2,1.8,2.6));
  }

  /* ----- toggles ----- */
  $('btnTag').addEventListener('click',e=>{tagsOn=!tagsOn;e.currentTarget.setAttribute('aria-pressed',tagsOn);dirty=true});
  $('btnCarry').addEventListener('click',e=>{carryOn=!carryOn;e.currentTarget.setAttribute('aria-pressed',carryOn);dirty=true});
  $('btnFlows').addEventListener('click',()=>{flowsOn=!flowsOn;updateFlowVis()});
  $('btnLog').addEventListener('click',()=>setJournal(!journalOn));
  updateFlowVis();


  /* ---------- bottom-sheet grip: drag to resize, tap to expand, drag low to close ---------- */
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('.grip'); if(!g||!isMobile())return;
    const sh=g.parentElement; drag={sh,y:e.clientY,h:sh.getBoundingClientRect().height,moved:false}; try{g.setPointerCapture(e.pointerId)}catch(_){}
  });
  addEventListener('pointermove',e=>{
    if(!drag)return; const dy=drag.y-e.clientY; if(Math.abs(dy)>4)drag.moved=true;
    if(drag.moved)drag.sh.style.height=clamp(drag.h+dy,80,innerHeight-70)+'px';
  });
  const endDrag=()=>{
    if(!drag)return; const sh=drag.sh;
    if(!drag.moved){sh.style.height='';sh.classList.toggle('full')}
    else if(sh.getBoundingClientRect().height<130){sh.style.height='';if(sh===card)closeCard();else if(sh===side)setSide(false);else setJournal(false)}
    drag=null;
  };
  addEventListener('pointerup',endDrag); addEventListener('pointercancel',endDrag);

  /* ---------- time menu (mobile), language ---------- */
  $('btnTime').addEventListener('click',e=>{const on=!$('hud').classList.contains('open');$('hud').classList.toggle('open',on);e.currentTarget.setAttribute('aria-pressed',on)});
  document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>{if(isMobile()){$('hud').classList.remove('open');$('btnTime').setAttribute('aria-pressed','false')}}));
  $('btnLang').textContent=LANG==='en'?'中':'EN';
  $('btnLang').setAttribute('aria-label',LANG==='en'?'切換為中文':'Switch to English');
  $('btnLang').addEventListener('click',()=>{store.set('techIsland.lang',LANG==='en'?'zh':'en');try{location.hash='';location.reload()}catch(e){}});
  window.__policyIsland.stats=()=>({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries});

  /* ---------- resize ---------- */
  let sized=false;
  new ResizeObserver(()=>{
    const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h)return;
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile()?1.4:1.75));
    renderer.setSize(w,h); labelRenderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    if(!sized){sized=true;goPano(true)} dirty=true;
  }).observe(stage);

  /* ---------- loop ---------- */
  const clk=new T.Clock(); let first=true;
  function frame(){
    requestAnimationFrame(frame);
    try{ renderFrame(); }catch(e){ if(!frameFailed){frameFailed=true;showError(e)} }
  }
  let frameFailed=false;
  function renderFrame(){
    const dt=Math.min(clk.getDelta(),.08); let need=dirty; dirty=false;
    if(fly){const k=clamp((performance.now()-fly.t0)/fly.ms,0,1),e=easeInOutCubic(k);
      camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.q0,fly.q1,e); if(k>=1)fly=null; need=true}
    if(!paused&&!reduced){minutes=(minutes+dt*10)%1440; simTime+=dt; ambient(dt); advanceWalkers(dt); need=true}
    const camDist=camera.position.distanceTo(controls.target); smallMeshes.forEach(m=>{m.visible=camDist<26});
    if(controls.update()) need=true;
    if(!need) return;
    placeWalkers(); applyEnv(); updateClock(false);
    labelRenderer.render(scene,camera); renderer.render(scene,camera);
    if(++tick%6===0||first)layoutLabels();
    if(first){first=false;$('loading').classList.add('hide');if(!store.get('techIsland.introSeen'))showIntro()}
  }
  { const w0=stage.clientWidth||innerWidth,h0=stage.clientHeight||innerHeight; renderer.setSize(w0,h0); labelRenderer.setSize(w0,h0); camera.aspect=w0/h0; camera.updateProjectionMatrix(); goPano(true); }
  updateClock(true); setSide(innerWidth>=1100); frame();
}catch(e){ showError(e); }
}
</script>

</body></html>
